name: Sync with NTX-dockit

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install Dependencies
        run: npm ci

      - name: Run Sync Script
        run: npm run sync:dockit

      - name: Open Pull Request for Dockit Updates
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: chore/sync-dockit
          delete-branch: true
          commit-message: "chore: sync content from NTX-dockit"
          title: "chore: sync content from NTX-dockit"
          body: "Automated sync of updated documentation from `NeuroTechX/NTX-dockit`. Review changes before merging."
          add-paths: src/content/dockit
